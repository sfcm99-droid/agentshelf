
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <meta name="viewport"
            content="width=device-width, initial-scale=1">
              <title>AgentShelf</title>
                <style>
                    * { box-sizing: border-box; }

                        body {
                              background: #0f172a;
                                    color: #f8fafc;
                                          font-family: Arial, sans-serif;
                                                margin: 0;
                                                      padding: 30px 20px;
                                                          }

                                                              main {
                                                                    max-width: 650px;
                                                                          margin: 70px auto;
                                                                              }

                                                                                  h1 { font-size: 42px; }

                                                                                      p {
                                                                                            color: #94a3b8;
                                                                                                  line-height: 1.6;
                                                                                                      }

                                                                                                          input {
                                                                                                                width: 100%;
                                                                                                                      padding: 16px;
                                                                                                                            border-radius: 10px;
                                                                                                                                  border: 1px solid #475569;
                                                                                                                                        background: #1e293b;
                                                                                                                                              color: white;
                                                                                                                                                    font-size: 16px;
                                                                                                                                                        }

                                                                                                                                                            button {
                                                                                                                                                                  background: #6ee7b7;
                                                                                                                                                                        color: #0f172a;
                                                                                                                                                                              border: none;
                                                                                                                                                                                    padding: 15px 25px;
                                                                                                                                                                                          border-radius: 10px;
                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                      margin-top: 15px;
                                                                                                                                                                                                            cursor: pointer;
                                                                                                                                                                                                                }

                                                                                                                                                                                                                    #resultado {
                                                                                                                                                                                                                          margin-top: 25px;
                                                                                                                                                                                                                                padding: 20px;
                                                                                                                                                                                                                                      background: #1e293b;
                                                                                                                                                                                                                                            border-radius: 10px;
                                                                                                                                                                                                                                                  display: none;
                                                                                                                                                                                                                                                        overflow-wrap: anywhere;
                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                              </style>
                                                                                                                                                                                                                                                              </head>
                                                                                                                                                                                                                                                              <body>
                                                                                                                                                                                                                                                                <main>
                                                                                                                                                                                                                                                                    <h1>AgentShelf</h1>
                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                              Descubre si tu tienda online está
                                                                                                                                                                                                                                                                                    preparada para buscadores y agentes
                                                                                                                                                                                                                                                                                          de inteligencia artificial.
                                                                                                                                                                                                                                                                                              </p>

                                                                                                                                                                                                                                                                                                  <input id="url" type="url"
                                                                                                                                                                                                                                                                                                             placeholder="https://tutienda.com">

                                                                                                                                                                                                                                                                                                                 <button onclick="analizar()">
                                                                                                                                                                                                                                                                                                                       Analizar mi web
                                                                                                                                                                                                                                                                                                                           </button>

                                                                                                                                                                                                                                                                                                                               <div id="resultado"></div>
                                                                                                                                                                                                                                                                                                                                 </main>

                                                                                                                                                                                                                                                                                                                                   
                                                                                                                                                                                                                                                                                                                                 <script>
                                                                                                                                                                                                                                                                                                                                   async function analizar() {
                                                                                                                                                                                                                                                                                                                                       const campo = document.getElementById("url");
                                                                                                                                                                                                                                                                                                                                           const resultado = document.getElementById("resultado");
                                                                                                                                                                                                                                                                                                                                               const entrada = campo.value.trim();

                                                                                                                                                                                                                                                                                                                                                   resultado.style.display = "block";

                                                                                                                                                                                                                                                                                                                                                       if (!entrada) {
                                                                                                                                                                                                                                                                                                                                                             resultado.textContent = "Introduce una dirección web.";
                                                                                                                                                                                                                                                                                                                                                                   return;
                                                                                                                                                                                                                                                                                                                                                                       }

                                                                                                                                                                                                                                                                                                                                                                           let url;

                                                                                                                                                                                                                                                                                                                                                                               try {
                                                                                                                                                                                                                                                                                                                                                                                     url = new URL(
                                                                                                                                                                                                                                                                                                                                                                                             /^https?:\/\//i.test(entrada)
                                                                                                                                                                                                                                                                                                                                                                                                       ? entrada
                                                                                                                                                                                                                                                                                                                                                                                                                 : "https://" + entrada
                                                                                                                                                                                                                                                                                                                                                                                                                       );

                                                                                                                                                                                                                                                                                                                                                                                                                             if (url.protocol !== "https:") {
                                                                                                                                                                                                                                                                                                                                                                                                                                     throw new Error("Solo se admiten direcciones HTTPS.");
                                                                                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                                                                                               } catch {
                                                                                                                                                                                                                                                                                                                                                                                                                                                     resultado.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                             "Introduce una dirección válida, como https://ejemplo.com";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                   return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                           resultado.textContent = "Analizando la página...";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                               try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     const api =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             "https://agentshelf-api.sfcm-99.workers.dev/analyze?url=" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     encodeURIComponent(url.href);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const respuesta = await fetch(api);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if (!respuesta.ok) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         throw new Error("Error del servicio: " + respuesta.status);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     const datos = await respuesta.json();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           if (datos.estado !== "analizado") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   resultado.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             "No se pudo completar el análisis.\n\n" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       (datos.mensaje || datos.error || "Error desconocido.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               resultado.style.whiteSpace = "pre-line";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   const lineas = [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           "RESULTADO DEL ANÁLISIS",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           "URL: " + datos.url,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "Bloques JSON-LD: " + datos.jsonLdBloques,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           "Bloques JSON-LD inválidos: " + datos.jsonLdInvalidos,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "Productos detectados: " + datos.productosDetectados,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ];

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (datos.productosDetectados === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               lineas.push(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         "No se han detectado productos estructurados en el HTML inicial.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "Esto no significa necesariamente que la tienda no tenga productos."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         lineas.push("EJEMPLOS DE PRODUCTOS", "");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 for (const producto of datos.ejemplos || []) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           lineas.push(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       "Producto: " + (producto.nombre || "Sin nombre"),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   "Precio: " + (producto.tienePrecio ? "Sí" : "No"),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               "Moneda: " + (producto.tieneMoneda ? "Sí" : "No"),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           "Disponibilidad: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         (producto.tieneDisponibilidad ? "Sí" : "No"),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     "Imagen: " + (producto.tieneImagen ? "Sí" : "No"),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 "Descripción: " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               (producto.tieneDescripcion ? "Sí" : "No"),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           ""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         lineas.push(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 "Nota: solo se analiza el HTML inicial de esta URL."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             resultado.style.whiteSpace = "pre-line";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   resultado.textContent = lineas.join("\n");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             resultado.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     "No se pudo conectar con el motor de análisis. " +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             error.message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   </script>
